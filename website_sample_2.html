/* Girly European summer: shell pink ground, white sheets, peony for large areas, hot pink only on small accents, deep mauve text. No animation. Big photos stay still while the page scrolls over them. */
.pi-site{
  --shell:#f9eef2; --white:#ffffff; --rose:#efd2dc; --peony:#d98caf; --hot:#ea4c9c;
  --mauve:#40202e; --mauve-2:#6f4a5a; --line:#e8c9d5; --stripe:#f4c6d7;
  --serif:&#x27;Lora&#x27;,Georgia,&#x27;Times New Roman&#x27;,serif;
  --sans:&#x27;Source Sans 3&#x27;,&#x27;Segoe UI&#x27;,Arial,sans-serif;
  background:var(--shell); color:var(--mauve); font-family:var(--sans); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.pi-site *{box-sizing:border-box}
.pi-site i,.pi-site em{font-style:normal !important}
.pi-site img{max-width:100%;display:block}
.pi-site p{margin:0 0 14px}
.pi-site h1,.pi-site h2,.pi-site h3{text-wrap:balance;margin:0}
.pi-site a{color:inherit}
.pi-wrap{max-width:1180px;margin:0 auto;padding-left:28px;padding-right:28px}

/* Labels and type */
.pi-label{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--hot);margin:0 0 14px}
.pi-h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,46px);line-height:1.12;letter-spacing:-.01em;color:var(--mauve)}
.pi-intro{color:var(--mauve-2);max-width:52ch;margin-top:16px}

/* Buttons: no movement, colour change only */
.pi-btn{display:inline-block;background:var(--hot);color:#fff !important;font-weight:700;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;padding:15px 26px;border-radius:2px;text-decoration:none;border:1px solid var(--hot)}
.pi-btn:hover,.pi-btn:focus-visible{background:var(--mauve);border-color:var(--mauve);outline:none}
.pi-btn.pi-ghost{background:transparent;border-color:rgba(255,255,255,.9)}
.pi-btn.pi-ghost:hover{background:#fff;color:var(--mauve) !important}
.pi-arrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve);text-decoration:none;border-bottom:1px solid var(--hot);padding-bottom:3px}
.pi-arrow::after{content:&quot;  →&quot;;color:var(--hot)}
.pi-arrow:hover{color:var(--hot)}

/* Unified tone (preview switch) */
.pi-tone{position:relative;overflow:hidden}
.pi-unified .pi-tone img,.pi-unified .pi-plx{filter:saturate(.86) contrast(.95) brightness(1.04)}
.pi-tone::after{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(160deg,rgba(234,76,156,.20),rgba(217,140,175,.08) 55%,rgba(255,214,170,.16));mix-blend-mode:soft-light;opacity:0}
.pi-unified .pi-tone::after{opacity:1}

/* The one moving effect: fixed photo layer */
.pi-plx{position:absolute;top:0;right:0;bottom:0;left:0;background-size:cover;background-position:center;background-attachment:fixed}
@media (hover:none),(max-width:900px){.pi-plx{background-attachment:scroll}}

/* Nav */
.pi-nav{position:absolute;top:0;left:0;right:0;z-index:5}
.pi-nav .pi-wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:24px}
.pi-nav img{width:128px}
.pi-nav ul{display:flex;align-items:center;gap:30px;list-style:none;margin:0;padding:0}
.pi-nav li a:not(.pi-btn){color:#fff;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.pi-nav li a:not(.pi-btn):hover{color:var(--rose)}
.pi-nav .pi-btn{padding:11px 18px}

/* Hero */
.pi-hero{position:relative;min-height:700px;display:flex;align-items:flex-end;color:#fff}
.pi-hero::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(180deg,rgba(64,32,46,.34) 0%,rgba(64,32,46,0) 24%,rgba(64,32,46,.12) 50%,rgba(64,32,46,.70) 100%)}
.pi-hero-in{position:relative;z-index:2;width:100%;padding-bottom:80px}
.pi-hero .pi-label{color:#fff;opacity:.92}
.pi-hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(42px,6.4vw,82px);line-height:1.02;letter-spacing:-.015em;max-width:12ch}
.pi-hero h1 span{color:var(--rose)}
.pi-hero p.pi-sub{font-size:19px;max-width:44ch;margin:22px 0 30px;color:#fff;opacity:.95}
.pi-cta{display:flex;flex-wrap:wrap;gap:12px}

/* Proof strip */
.pi-proof{background:var(--white);border-bottom:1px solid var(--line)}
.pi-proof ul{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;margin:0;padding:0}
.pi-proof li{padding:22px 18px;text-align:center;font-weight:600;font-size:15.5px;color:var(--mauve)}
.pi-proof li + li{border-left:1px solid var(--line)}

/* Awning stripe divider */
.pi-stripe{height:16px;background:repeating-linear-gradient(90deg,var(--stripe) 0 28px,var(--white) 28px 56px)}

/* Sections */
.pi-sec{padding:110px 0}
.pi-sec.pi-white{background:var(--white)}

/* Intro split */
.pi-split{display:grid;grid-template-columns:5fr 6fr;gap:72px;align-items:center}
.pi-split-img{aspect-ratio:4/5}
.pi-split-img img{width:100%;height:100%;object-fit:cover}
.pi-points{display:grid;gap:0;margin-top:34px;border-top:1px solid var(--line)}
.pi-point{display:grid;grid-template-columns:190px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.pi-point b{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--mauve);line-height:1.3}
.pi-point span{color:var(--mauve-2)}

/* Experiences */
.pi-sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:48px;flex-wrap:wrap}
.pi-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 22px}
.pi-card{display:flex;flex-direction:column;text-decoration:none;color:var(--mauve)}
.pi-card-img{display:block;aspect-ratio:4/5;background:var(--rose)}
.pi-card-img img{width:100%;height:100%;object-fit:cover}
.pi-card-t{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.25;margin-top:16px}
.pi-card-d{font-size:15px;color:var(--mauve-2);margin-top:4px;line-height:1.45}
.pi-card:hover .pi-card-t{color:var(--hot)}

/* Photo break */
.pi-break{position:relative;min-height:560px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.pi-break::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:rgba(64,32,46,.38)}
.pi-break-in{position:relative;z-index:2;padding:0 24px}
.pi-break h2{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.6vw,58px);line-height:1.1;max-width:18ch;margin:0 auto}
.pi-break .pi-label{color:#fff}

/* Itineraries */
.pi-its{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.pi-it{background:var(--white);padding:0 0 28px;display:flex;flex-direction:column;border:1px solid var(--line)}
.pi-it-img{aspect-ratio:4/3}
.pi-it-img img{width:100%;height:100%;object-fit:cover}
.pi-it .pi-label{margin:24px 26px 8px}
.pi-it h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2;margin:0 26px 14px;color:var(--mauve)}
.pi-it ul{list-style:none;margin:0 26px 22px;padding:0;flex:1}
.pi-it li{padding:9px 0;border-top:1px solid var(--line);font-size:15.5px;color:var(--mauve-2)}
.pi-it .pi-arrow{margin:0 26px;align-self:flex-start}
.pi-it-more{margin-top:40px;text-align:center}

/* How it works band */
.pi-how{position:relative;padding:120px 0}
.pi-how::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(90deg,rgba(64,32,46,.10),rgba(64,32,46,0) 60%)}
.pi-how .pi-wrap{position:relative;z-index:2}
.pi-panel{background:var(--white);max-width:540px;padding:48px 46px}
.pi-steps{list-style:none;margin:30px 0 32px;padding:0;counter-reset:s}
.pi-steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.pi-steps li::before{content:&quot;0&quot; counter(s);font-family:var(--serif);font-size:20px;color:var(--hot)}
.pi-steps b{display:block;font-weight:700;color:var(--mauve)}
.pi-steps span{color:var(--mauve-2);font-size:15.5px}

/* Magazine grid */
.pi-mag{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:92px;gap:12px;grid-auto-flow:dense}
.pi-m{margin:0}
.pi-m img{width:100%;height:100%;object-fit:cover}
.w2{grid-column:span 2} .w3{grid-column:span 3} .w4{grid-column:span 4}
.h2{grid-row:span 2} .h3{grid-row:span 3}

/* Reviews */
.pi-revs{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.pi-rev{border-top:2px solid var(--peony);padding-top:24px;display:flex;flex-direction:column;gap:18px}
.pi-rev p{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.45;color:var(--mauve);margin:0;flex:1}
.pi-rev .pi-who{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve)}
.pi-rev .pi-who span{display:block;color:var(--mauve-2);font-weight:600;letter-spacing:.08em;margin-top:2px}
.pi-stars{color:var(--hot);letter-spacing:3px;font-size:14px}

/* Quote */
.pi-q{display:grid;grid-template-columns:5fr 6fr;gap:0;background:var(--white);border:1px solid var(--line)}
.pi-q-img{min-height:100%}
.pi-q-img img{width:100%;height:100%;object-fit:cover}
.pi-q-body{padding:56px 52px}
.pi-form{display:grid;grid-template-columns:1fr 1fr;gap:18px 18px;margin-top:30px}
.pi-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.pi-field.pi-full{grid-column:1/-1}
.pi-field label,.pi-field .pi-fl{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve)}
.pi-field input,.pi-field select,.pi-field textarea{font:inherit;font-size:16px;color:var(--mauve);background:var(--shell);border:1px solid var(--line);border-radius:2px;padding:12px 13px;width:100%}
.pi-field input:focus,.pi-field select:focus,.pi-field textarea:focus{outline:1px solid var(--hot);border-color:var(--hot)}
.pi-chips{display:flex;flex-wrap:wrap;gap:8px}
.pi-chip{position:relative}
.pi-chip input{position:absolute;opacity:0;width:1px;height:1px}
.pi-chip span{display:inline-block;border:1px solid var(--line);background:var(--white);color:var(--mauve);font-weight:600;font-size:14.5px;padding:8px 14px;border-radius:2px;cursor:pointer}
.pi-chip input:checked + span{background:var(--mauve);border-color:var(--mauve);color:#fff}
.pi-chip input:focus-visible + span{outline:2px solid var(--hot);outline-offset:2px}
.pi-form .pi-btn{grid-column:1/-1;justify-self:start;cursor:pointer;font-family:var(--sans)}
.pi-small{grid-column:1/-1;color:var(--mauve-2);font-size:14px;margin:0}
.pi-thanks{grid-column:1/-1;background:var(--rose);padding:16px 18px;font-weight:600;color:var(--mauve)}

/* Footer */
.pi-foot{background:var(--mauve);color:#f3dfe7;padding:64px 0 40px}
.pi-foot-top{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:40px;align-items:start}
.pi-foot img.pi-flogo{width:140px}
.pi-foot h4{margin:0 0 12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--peony)}
.pi-foot p{margin:0 0 6px;font-size:15.5px}
.pi-foot a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.pi-foot img.pi-fqr{width:96px;background:#fff;padding:5px}
.pi-foot-bottom{margin-top:48px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);font-size:13.5px;color:#cfaebc}

@media (max-width:1000px){
  .pi-cards{grid-template-columns:repeat(3,1fr)}
  .pi-split,.pi-q{grid-template-columns:1fr}
  .pi-split{gap:44px}
  .pi-q-img{aspect-ratio:16/9}
  .pi-foot-top{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .pi-wrap{padding-left:20px;padding-right:20px}
  .pi-nav ul li:not(:last-child){display:none}
  .pi-nav img{width:108px}
  .pi-hero{min-height:600px}
  .pi-hero-in{padding-bottom:56px}
  .pi-hero p.pi-sub{font-size:17px}
  .pi-proof ul{grid-template-columns:1fr 1fr}
  .pi-proof li{padding:16px 10px;font-size:14px}
  .pi-proof li:nth-child(3){border-left:0}
  .pi-proof li:nth-child(n+3){border-top:1px solid var(--line)}
  .pi-sec{padding:72px 0}
  .pi-point{grid-template-columns:1fr;gap:4px}
  .pi-cards{grid-template-columns:1fr 1fr;gap:28px 14px}
  .pi-card-t{font-size:18px}
  .pi-card-d{display:none}
  .pi-its,.pi-revs{grid-template-columns:1fr}
  .pi-break{min-height:420px}
  .pi-how{padding:64px 0}
  .pi-panel{padding:32px 24px}
  .pi-mag{grid-template-columns:repeat(4,1fr);grid-auto-rows:80px}
  .pi-mag .w3,.pi-mag .w4{grid-column:span 4}
  .pi-q-body{padding:34px 22px}
  .pi-form{grid-template-columns:1fr}
  .pi-foot-top{grid-template-columns:1fr}
}
&lt;/style&gt;

&lt;style&gt;
/* Girly European summer: shell pink ground, white sheets, peony for large areas, hot pink only on small accents, deep mauve text. No animation. Big photos stay still while the page scrolls over them. */
.pi-site{
  --shell:#f9eef2; --white:#ffffff; --rose:#efd2dc; --peony:#d98caf; --hot:#ea4c9c;
  --mauve:#40202e; --mauve-2:#6f4a5a; --line:#e8c9d5; --stripe:#f4c6d7;
  --serif:&#x27;Lora&#x27;,Georgia,&#x27;Times New Roman&#x27;,serif;
  --sans:&#x27;Source Sans 3&#x27;,&#x27;Segoe UI&#x27;,Arial,sans-serif;
  background:var(--shell); color:var(--mauve); font-family:var(--sans); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.pi-site *{box-sizing:border-box}
.pi-site i,.pi-site em{font-style:normal !important}
.pi-site img{max-width:100%;display:block}
.pi-site p{margin:0 0 14px}
.pi-site h1,.pi-site h2,.pi-site h3{text-wrap:balance;margin:0}
.pi-site a{color:inherit}
.pi-wrap{max-width:1180px;margin:0 auto;padding-left:28px;padding-right:28px}

/* Labels and type */
.pi-label{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--hot);margin:0 0 14px}
.pi-h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,46px);line-height:1.12;letter-spacing:-.01em;color:var(--mauve)}
.pi-intro{color:var(--mauve-2);max-width:52ch;margin-top:16px}

/* Buttons: no movement, colour change only */
.pi-btn{display:inline-block;background:var(--hot);color:#fff !important;font-weight:700;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;padding:15px 26px;border-radius:2px;text-decoration:none;border:1px solid var(--hot)}
.pi-btn:hover,.pi-btn:focus-visible{background:var(--mauve);border-color:var(--mauve);outline:none}
.pi-btn.pi-ghost{background:transparent;border-color:rgba(255,255,255,.9)}
.pi-btn.pi-ghost:hover{background:#fff;color:var(--mauve) !important}
.pi-arrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve);text-decoration:none;border-bottom:1px solid var(--hot);padding-bottom:3px}
.pi-arrow::after{content:&quot;  →&quot;;color:var(--hot)}
.pi-arrow:hover{color:var(--hot)}

/* Unified tone (preview switch) */
.pi-tone{position:relative;overflow:hidden}
.pi-unified .pi-tone img,.pi-unified .pi-plx{filter:saturate(.86) contrast(.95) brightness(1.04)}
.pi-tone::after{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(160deg,rgba(234,76,156,.20),rgba(217,140,175,.08) 55%,rgba(255,214,170,.16));mix-blend-mode:soft-light;opacity:0}
.pi-unified .pi-tone::after{opacity:1}

/* The one moving effect: fixed photo layer */
.pi-plx{position:absolute;top:0;right:0;bottom:0;left:0;background-size:cover;background-position:center;background-attachment:fixed}
@media (hover:none),(max-width:900px){.pi-plx{background-attachment:scroll}}

/* Nav */
.pi-nav{position:absolute;top:0;left:0;right:0;z-index:5}
.pi-nav .pi-wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:24px}
.pi-nav img{width:128px}
.pi-nav ul{display:flex;align-items:center;gap:30px;list-style:none;margin:0;padding:0}
.pi-nav li a:not(.pi-btn){color:#fff;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.pi-nav li a:not(.pi-btn):hover{color:var(--rose)}
.pi-nav .pi-btn{padding:11px 18px}

/* Hero */
.pi-hero{position:relative;min-height:700px;display:flex;align-items:flex-end;color:#fff}
.pi-hero::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(180deg,rgba(64,32,46,.34) 0%,rgba(64,32,46,0) 24%,rgba(64,32,46,.12) 50%,rgba(64,32,46,.70) 100%)}
.pi-hero-in{position:relative;z-index:2;width:100%;padding-bottom:80px}
.pi-hero .pi-label{color:#fff;opacity:.92}
.pi-hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(42px,6.4vw,82px);line-height:1.02;letter-spacing:-.015em;max-width:12ch}
.pi-hero h1 span{color:var(--rose)}
.pi-hero p.pi-sub{font-size:19px;max-width:44ch;margin:22px 0 30px;color:#fff;opacity:.95}
.pi-cta{display:flex;flex-wrap:wrap;gap:12px}

/* Proof strip */
.pi-proof{background:var(--white);border-bottom:1px solid var(--line)}
.pi-proof ul{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;margin:0;padding:0}
.pi-proof li{padding:22px 18px;text-align:center;font-weight:600;font-size:15.5px;color:var(--mauve)}
.pi-proof li + li{border-left:1px solid var(--line)}

/* Awning stripe divider */
.pi-stripe{height:16px;background:repeating-linear-gradient(90deg,var(--stripe) 0 28px,var(--white) 28px 56px)}

/* Sections */
.pi-sec{padding:110px 0}
.pi-sec.pi-white{background:var(--white)}

/* Intro split */
.pi-split{display:grid;grid-template-columns:5fr 6fr;gap:72px;align-items:center}
.pi-split-img{aspect-ratio:4/5}
.pi-split-img img{width:100%;height:100%;object-fit:cover}
.pi-points{display:grid;gap:0;margin-top:34px;border-top:1px solid var(--line)}
.pi-point{display:grid;grid-template-columns:190px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.pi-point b{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--mauve);line-height:1.3}
.pi-point span{color:var(--mauve-2)}

/* Experiences */
.pi-sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:48px;flex-wrap:wrap}
.pi-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 22px}
.pi-card{display:flex;flex-direction:column;text-decoration:none;color:var(--mauve)}
.pi-card-img{display:block;aspect-ratio:4/5;background:var(--rose)}
.pi-card-img img{width:100%;height:100%;object-fit:cover}
.pi-card-t{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.25;margin-top:16px}
.pi-card-d{font-size:15px;color:var(--mauve-2);margin-top:4px;line-height:1.45}
.pi-card:hover .pi-card-t{color:var(--hot)}

/* Photo break */
.pi-break{position:relative;min-height:560px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.pi-break::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:rgba(64,32,46,.38)}
.pi-break-in{position:relative;z-index:2;padding:0 24px}
.pi-break h2{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.6vw,58px);line-height:1.1;max-width:18ch;margin:0 auto}
.pi-break .pi-label{color:#fff}

/* Itineraries */
.pi-its{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.pi-it{background:var(--white);padding:0 0 28px;display:flex;flex-direction:column;border:1px solid var(--line)}
.pi-it-img{aspect-ratio:4/3}
.pi-it-img img{width:100%;height:100%;object-fit:cover}
.pi-it .pi-label{margin:24px 26px 8px}
.pi-it h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2;margin:0 26px 14px;color:var(--mauve)}
.pi-it ul{list-style:none;margin:0 26px 22px;padding:0;flex:1}
.pi-it li{padding:9px 0;border-top:1px solid var(--line);font-size:15.5px;color:var(--mauve-2)}
.pi-it .pi-arrow{margin:0 26px;align-self:flex-start}
.pi-it-more{margin-top:40px;text-align:center}

/* How it works band */
.pi-how{position:relative;padding:120px 0}
.pi-how::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(90deg,rgba(64,32,46,.10),rgba(64,32,46,0) 60%)}
.pi-how .pi-wrap{position:relative;z-index:2}
.pi-panel{background:var(--white);max-width:540px;padding:48px 46px}
.pi-steps{list-style:none;margin:30px 0 32px;padding:0;counter-reset:s}
.pi-steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.pi-steps li::before{content:&quot;0&quot; counter(s);font-family:var(--serif);font-size:20px;color:var(--hot)}
.pi-steps b{display:block;font-weight:700;color:var(--mauve)}
.pi-steps span{color:var(--mauve-2);font-size:15.5px}

/* Magazine grid */
.pi-mag{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:92px;gap:12px;grid-auto-flow:dense}
.pi-m{margin:0}
.pi-m img{width:100%;height:100%;object-fit:cover}
.w2{grid-column:span 2} .w3{grid-column:span 3} .w4{grid-column:span 4}
.h2{grid-row:span 2} .h3{grid-row:span 3}

/* Reviews */
.pi-revs{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.pi-rev{border-top:2px solid var(--peony);padding-top:24px;display:flex;flex-direction:column;gap:18px}
.pi-rev p{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.45;color:var(--mauve);margin:0;flex:1}
.pi-rev .pi-who{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve)}
.pi-rev .pi-who span{display:block;color:var(--mauve-2);font-weight:600;letter-spacing:.08em;margin-top:2px}
.pi-stars{color:var(--hot);letter-spacing:3px;font-size:14px}

/* Quote */
.pi-q{display:grid;grid-template-columns:5fr 6fr;gap:0;background:var(--white);border:1px solid var(--line)}
.pi-q-img{min-height:100%}
.pi-q-img img{width:100%;height:100%;object-fit:cover}
.pi-q-body{padding:56px 52px}
.pi-form{display:grid;grid-template-columns:1fr 1fr;gap:18px 18px;margin-top:30px}
.pi-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.pi-field.pi-full{grid-column:1/-1}
.pi-field label,.pi-field .pi-fl{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve)}
.pi-field input,.pi-field select,.pi-field textarea{font:inherit;font-size:16px;color:var(--mauve);background:var(--shell);border:1px solid var(--line);border-radius:2px;padding:12px 13px;width:100%}
.pi-field input:focus,.pi-field select:focus,.pi-field textarea:focus{outline:1px solid var(--hot);border-color:var(--hot)}
.pi-chips{display:flex;flex-wrap:wrap;gap:8px}
.pi-chip{position:relative}
.pi-chip input{position:absolute;opacity:0;width:1px;height:1px}
.pi-chip span{display:inline-block;border:1px solid var(--line);background:var(--white);color:var(--mauve);font-weight:600;font-size:14.5px;padding:8px 14px;border-radius:2px;cursor:pointer}
.pi-chip input:checked + span{background:var(--mauve);border-color:var(--mauve);color:#fff}
.pi-chip input:focus-visible + span{outline:2px solid var(--hot);outline-offset:2px}
.pi-form .pi-btn{grid-column:1/-1;justify-self:start;cursor:pointer;font-family:var(--sans)}
.pi-small{grid-column:1/-1;color:var(--mauve-2);font-size:14px;margin:0}
.pi-thanks{grid-column:1/-1;background:var(--rose);padding:16px 18px;font-weight:600;color:var(--mauve)}

/* Footer */
.pi-foot{background:var(--mauve);color:#f3dfe7;padding:64px 0 40px}
.pi-foot-top{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:40px;align-items:start}
.pi-foot img.pi-flogo{width:140px}
.pi-foot h4{margin:0 0 12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--peony)}
.pi-foot p{margin:0 0 6px;font-size:15.5px}
.pi-foot a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.pi-foot img.pi-fqr{width:96px;background:#fff;padding:5px}
.pi-foot-bottom{margin-top:48px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);font-size:13.5px;color:#cfaebc}

@media (max-width:1000px){

  .pi-card-t{font-size:18px}

  .pi-break{min-height:420px}

  .pi-form{grid-template-columns:1fr}
  .pi-foot-top{grid-template-columns:1fr}

&lt;style&gt;
/* Girly European summer: shell pink ground, white sheets, peony for large areas, hot pink only on small accents, deep mauve text. No animation. Big photos stay still while the page scrolls over them. */
.pi-site{
  --shell:#f9eef2; --white:#ffffff; --rose:#efd2dc; --peony:#d98caf; --hot:#ea4c9c;
  --mauve:#40202e; --mauve-2:#6f4a5a; --line:#e8c9d5; --stripe:#f4c6d7;
  --serif:&#x27;Lora&#x27;,Georgia,&#x27;Times New Roman&#x27;,serif;
  --sans:&#x27;Source Sans 3&#x27;,&#x27;Segoe UI&#x27;,Arial,sans-serif;
  background:var(--shell); color:var(--mauve); font-family:var(--sans); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.pi-site *{box-sizing:border-box}
.pi-site i,.pi-site em{font-style:normal !important}
.pi-site img{max-width:100%;display:block}
.pi-site p{margin:0 0 14px}
.pi-site h1,.pi-site h2,.pi-site h3{text-wrap:balance;margin:0}
.pi-site a{color:inherit}
.pi-wrap{max-width:1180px;margin:0 auto;padding-left:28px;padding-right:28px}

/* Labels and type */
.pi-label{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--hot);margin:0 0 14px}
.pi-h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,46px);line-height:1.12;letter-spacing:-.01em;color:var(--mauve)}
.pi-intro{color:var(--mauve-2);max-width:52ch;margin-top:16px}

/* Buttons: no movement, colour change only */
.pi-btn{display:inline-block;background:var(--hot);color:#fff !important;font-weight:700;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;padding:15px 26px;border-radius:2px;text-decoration:none;border:1px solid var(--hot)}
.pi-btn:hover,.pi-btn:focus-visible{background:var(--mauve);border-color:var(--mauve);outline:none}
.pi-btn.pi-ghost{background:transparent;border-color:rgba(255,255,255,.9)}
.pi-btn.pi-ghost:hover{background:#fff;color:var(--mauve) !important}
.pi-arrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve);text-decoration:none;border-bottom:1px solid var(--hot);padding-bottom:3px}
.pi-arrow::after{content:&quot;  →&quot;;color:var(--hot)}
.pi-arrow:hover{color:var(--hot)}

/* Unified tone (preview switch) */
.pi-tone{position:relative;overflow:hidden}
.pi-unified .pi-tone img,.pi-unified .pi-plx{filter:saturate(.86) contrast(.95) brightness(1.04)}
.pi-tone::after{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(160deg,rgba(234,76,156,.20),rgba(217,140,175,.08) 55%,rgba(255,214,170,.16));mix-blend-mode:soft-light;opacity:0}
.pi-unified .pi-tone::after{opacity:1}

/* The one moving effect: fixed photo layer */
.pi-plx{position:absolute;top:0;right:0;bottom:0;left:0;background-size:cover;background-position:center;background-attachment:fixed}
@media (hover:none),(max-width:900px){.pi-plx{background-attachment:scroll}}

/* Nav */
.pi-nav{position:absolute;top:0;left:0;right:0;z-index:5}
.pi-nav .pi-wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:24px}
.pi-nav img{width:128px}
.pi-nav ul{display:flex;align-items:center;gap:30px;list-style:none;margin:0;padding:0}
.pi-nav li a:not(.pi-btn){color:#fff;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.pi-nav li a:not(.pi-btn):hover{color:var(--rose)}
.pi-nav .pi-btn{padding:11px 18px}

/* Hero */
.pi-hero{position:relative;min-height:700px;display:flex;align-items:flex-end;color:#fff}
.pi-hero::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(180deg,rgba(64,32,46,.34) 0%,rgba(64,32,46,0) 24%,rgba(64,32,46,.12) 50%,rgba(64,32,46,.70) 100%)}
.pi-hero-in{position:relative;z-index:2;width:100%;padding-bottom:80px}
.pi-hero .pi-label{color:#fff;opacity:.92}
.pi-hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(42px,6.4vw,82px);line-height:1.02;letter-spacing:-.015em;max-width:12ch}
.pi-hero h1 span{color:var(--rose)}
.pi-hero p.pi-sub{font-size:19px;max-width:44ch;margin:22px 0 30px;color:#fff;opacity:.95}
.pi-cta{display:flex;flex-wrap:wrap;gap:12px}

/* Proof strip */
.pi-proof{background:var(--white);border-bottom:1px solid var(--line)}
.pi-proof ul{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;margin:0;padding:0}
.pi-proof li{padding:22px 18px;text-align:center;font-weight:600;font-size:15.5px;color:var(--mauve)}
.pi-proof li + li{border-left:1px solid var(--line)}

/* Awning stripe divider */
.pi-stripe{height:16px;background:repeating-linear-gradient(90deg,var(--stripe) 0 28px,var(--white) 28px 56px)}

/* Sections */
.pi-sec{padding:110px 0}
.pi-sec.pi-white{background:var(--white)}

/* Intro split */
.pi-split{display:grid;grid-template-columns:5fr 6fr;gap:72px;align-items:center}
.pi-split-img{aspect-ratio:4/5}
.pi-split-img img{width:100%;height:100%;object-fit:cover}
.pi-points{display:grid;gap:0;margin-top:34px;border-top:1px solid var(--line)}
.pi-point{display:grid;grid-template-columns:190px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.pi-point b{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--mauve);line-height:1.3}
.pi-point span{color:var(--mauve-2)}

/* Experiences */
.pi-sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:48px;flex-wrap:wrap}
.pi-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 22px}
.pi-card{display:flex;flex-direction:column;text-decoration:none;color:var(--mauve)}
.pi-card-img{display:block;aspect-ratio:4/5;background:var(--rose)}
.pi-card-img img{width:100%;height:100%;object-fit:cover}
.pi-card-t{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.25;margin-top:16px}
.pi-card-d{font-size:15px;color:var(--mauve-2);margin-top:4px;line-height:1.45}
.pi-card:hover .pi-card-t{color:var(--hot)}

/* Photo break */
.pi-break{position:relative;min-height:560px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.pi-break::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:rgba(64,32,46,.38)}
.pi-break-in{position:relative;z-index:2;padding:0 24px}
.pi-break h2{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.6vw,58px);line-height:1.1;max-width:18ch;margin:0 auto}
.pi-break .pi-label{color:#fff}

/* Itineraries */
.pi-its{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.pi-it{background:var(--white);padding:0 0 28px;display:flex;flex-direction:column;border:1px solid var(--line)}
.pi-it-img{aspect-ratio:4/3}
.pi-it-img img{width:100%;height:100%;object-fit:cover}
.pi-it .pi-label{margin:24px 26px 8px}
.pi-it h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2;margin:0 26px 14px;color:var(--mauve)}
.pi-it ul{list-style:none;margin:0 26px 22px;padding:0;flex:1}
.pi-it li{padding:9px 0;border-top:1px solid var(--line);font-size:15.5px;color:var(--mauve-2)}
.pi-it .pi-arrow{margin:0 26px;align-self:flex-start}
.pi-it-more{margin-top:40px;text-align:center}

/* How it works band */
.pi-how{position:relative;padding:120px 0}
.pi-how::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(90deg,rgba(64,32,46,.10),rgba(64,32,46,0) 60%)}
.pi-how .pi-wrap{position:relative;z-index:2}
.pi-panel{background:var(--white);max-width:540px;padding:48px 46px}
.pi-steps{list-style:none;margin:30px 0 32px;padding:0;counter-reset:s}
.pi-steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.pi-steps li::before{content:&quot;0&quot; counter(s);font-family:var(--serif);font-size:20px;color:var(--hot)}
.pi-steps b{display:block;font-weight:700;color:var(--mauve)}
.pi-steps span{color:var(--mauve-2);font-size:15.5px}

/* Magazine grid */
.pi-mag{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:92px;gap:12px;grid-auto-flow:dense}
.pi-m{margin:0}
.pi-m img{width:100%;height:100%;object-fit:cover}
.w2{grid-column:span 2} .w3{grid-column:span 3} .w4{grid-column:span 4}
.h2{grid-row:span 2} .h3{grid-row:span 3}

/* Reviews */
.pi-revs{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.pi-rev{border-top:2px solid var(--peony);padding-top:24px;display:flex;flex-direction:column;gap:18px}
.pi-rev p{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.45;color:var(--mauve);margin:0;flex:1}
.pi-rev .pi-who{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve)}
.pi-rev .pi-who span{display:block;color:var(--mauve-2);font-weight:600;letter-spacing:.08em;margin-top:2px}
.pi-stars{color:var(--hot);letter-spacing:3px;font-size:14px}

/* Quote */
.pi-q{display:grid;grid-template-columns:5fr 6fr;gap:0;background:var(--white);border:1px solid var(--line)}
.pi-q-img{min-height:100%}
.pi-q-img img{width:100%;height:100%;object-fit:cover}
.pi-q-body{padding:56px 52px}
.pi-form{display:grid;grid-template-columns:1fr 1fr;gap:18px 18px;margin-top:30px}
.pi-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.pi-field.pi-full{grid-column:1/-1}
.pi-field label,.pi-field .pi-fl{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve)}
.pi-field input,.pi-field select,.pi-field textarea{font:inherit;font-size:16px;color:var(--mauve);background:var(--shell);border:1px solid var(--line);border-radius:2px;padding:12px 13px;width:100%}
.pi-field input:focus,.pi-field select:focus,.pi-field textarea:focus{outline:1px solid var(--hot);border-color:var(--hot)}
.pi-chips{display:flex;flex-wrap:wrap;gap:8px}
.pi-chip{position:relative}
.pi-chip input{position:absolute;opacity:0;width:1px;height:1px}
.pi-chip span{display:inline-block;border:1px solid var(--line);background:var(--white);color:var(--mauve);font-weight:600;font-size:14.5px;padding:8px 14px;border-radius:2px;cursor:pointer}
.pi-chip input:checked + span{background:var(--mauve);border-color:var(--mauve);color:#fff}
.pi-chip input:focus-visible + span{outline:2px solid var(--hot);outline-offset:2px}
.pi-form .pi-btn{grid-column:1/-1;justify-self:start;cursor:pointer;font-family:var(--sans)}
.pi-small{grid-column:1/-1;color:var(--mauve-2);font-size:14px;margin:0}
.pi-thanks{grid-column:1/-1;background:var(--rose);padding:16px 18px;font-weight:600;color:var(--mauve)}

/* Footer */
.pi-foot{background:var(--mauve);color:#f3dfe7;padding:64px 0 40px}
.pi-foot-top{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:40px;align-items:start}
.pi-foot img.pi-flogo{width:140px}
.pi-foot h4{margin:0 0 12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--peony)}
.pi-foot p{margin:0 0 6px;font-size:15.5px}
.pi-foot a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.pi-foot img.pi-fqr{width:96px;background:#fff;padding:5px}
.pi-foot-bottom{margin-top:48px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);font-size:13.5px;color:#cfaebc}

@media (max-width:1000px){
  .pi-cards{grid-template-columns:repeat(3,1fr)}
  .pi-split,.pi-q{grid-template-columns:1fr}
  .pi-split{gap:44px}
  .pi-q-img{aspect-ratio:16/9}
  .pi-foot-top{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .pi-wrap{padding-left:20px;padding-right:20px}
  .pi-nav ul li:not(:last-child){display:none}
  .pi-nav img{width:108px}
  .pi-hero{min-height:600px}
  .pi-hero-in{padding-bottom:56px}
  .pi-hero p.pi-sub{font-size:17px}
  .pi-proof ul{grid-template-columns:1fr 1fr}
  .pi-proof li{padding:16px 10px;font-size:14px}
  .pi-proof li:nth-child(3){border-left:0}
  .pi-proof li:nth-child(n+3){border-top:1px solid var(--line)}
  .pi-sec{padding:72px 0}
  .pi-point{grid-template-columns:1fr;gap:4px}
  .pi-cards{grid-template-columns:1fr 1fr;gap:28px 14px}
  .pi-card-t{font-size:18px}
  .pi-card-d{display:none}
  .pi-its,.pi-revs{grid-template-columns:1fr}
  .pi-break{min-height:420px}
  .pi-how{padding:64px 0}
  .pi-panel{padding:32px 24px}
  .pi-mag{grid-template-columns:repeat(4,1fr);grid-auto-rows:80px}
  .pi-mag .w3,.pi-mag .w4{grid-column:span 4}
  .pi-q-body{padding:34px 22px}
  .pi-form{grid-template-columns:1fr}
  .pi-foot-top{grid-template-columns:1fr}
}

    views.forEach(function(b){b.setAttribute('aria-pressed',b===btn?'true':'false');});
    fb.hidden=btn!==vBefore; fa.hidden=btn!==vAfter; cd.hidden=btn!==vCode;
    if(btn===vBefore)setR(fb,r); if(btn===vAfter)setR(fa,r);
  }
  vBefore.onclick=function(){show(vBefore);}; vAfter.onclick=function(){show(vAfter);}; vCode.onclick=function(){show(vCode);};
  function press(a,b){a.setAttribute('aria-pressed','true');b.setAttribute('aria-pressed','false');}
  sDesk.onclick=function(){press(sDesk,sPhone);fa.classList.remove('phone');fb.classList.remove('phone');};
  sPhone.onclick=function(){press(sPhone,sDesk);fa.classList.add('phone');fb.classList.add('phone');};
  function tone(on){[fa,fb].forEach(function(fr){try{fr.contentDocument.querySelector('.pi-site').classList.toggle('pi-unified',on);}catch(e){}});}
  tOn.onclick=function(){press(tOn,tOff);tone(true);};
  tOff.onclick=function(){press(tOff,tOn);tone(false);};
  copy.onclick=function(){
    var t=cd.value;
    var done=function(){copy.textContent='Copied';setTimeout(function(){copy.textContent='Copy for GHL';},1600);};
    var fall=function(){show(vCode);cd.focus();cd.select();};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fall);}else{fall();}
  };
})();
</script>
</body></html>
