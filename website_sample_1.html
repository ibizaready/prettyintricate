.pi-site{
  --blush:#fff0f7; --white:#ffffff; --candy:#fcd9ec; --candy-light:#f8e3ef;
  --pink-a:#fbcfe8; --lilac-a:#ead4fb; --lilac:#d9a8e4; --hot:#ea4c9c;
  --magenta:#c026d3; --orchid:#b04fb4; --navy:#3a3f7e; --ink:#2b2b33; --grey:#6e6e7a;
  --serif:&#x27;Lora&#x27;,Georgia,&#x27;Times New Roman&#x27;,serif;

  --wrap:1120px;
  background:var(--blush); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.6;

.pi-site *{box-sizing:border-box}
.pi-site i,.pi-site em{font-style:normal !important}
.pi-site img{max-width:100%;display:block}

.pi-wrap{max-width:var(--wrap);margin:0 auto;padding-left:24px;padding-right:24px}

/* Unified tone: every mood photo gets the same soft pink grade so 33 different photos read as one set */
.pi-site .pi-tone{position:relative;overflow:hidden}
.pi-site .pi-tone img{transition:filter .4s ease}
.pi-site.pi-unified .pi-tone img{filter:saturate(.88) contrast(.95) brightness(1.03)}
.pi-site .pi-tone::after{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(160deg,rgba(234,76,156,.22),rgba(176,79,180,.10) 55%,rgba(255,214,170,.18));mix-blend-mode:soft-light;opacity:0;transition:opacity .4s ease}
.pi-site.pi-unified .pi-tone::after{opacity:1}

/* Nav */
.pi-nav{position:absolute;top:0;left:0;right:0;z-index:5}
.pi-nav .pi-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px}
.pi-nav img{width:132px}
.pi-nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0}
.pi-nav a{color:#fff;text-decoration:none;font-weight:600;font-size:15.5px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.pi-nav .pi-btn{text-shadow:none}

/* Buttons */
.pi-btn{display:inline-block;background:var(--hot);color:#fff !important;font-weight:700;font-size:16px;padding:12px 22px;border-radius:999px;text-decoration:none;border:2px solid var(--hot);transition:transform .2s ease, background .2s ease}
.pi-btn:hover,.pi-btn:focus-visible{transform:translateY(-1px);background:#d93a8a;outline:none}
.pi-btn.pi-ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.85)}
.pi-btn.pi-ghost:hover{background:rgba(255,255,255,.28)}
.pi-link{color:var(--hot);font-weight:700;text-decoration:none;border-bottom:2px solid var(--candy)}
.pi-link:hover{border-color:var(--hot)}

/* Hero */
.pi-hero{position:relative;min-height:640px;display:flex;align-items:flex-end;color:#fff}
.pi-hero &gt; img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.pi-hero::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(180deg,rgba(18,8,30,.30) 0%,rgba(18,8,30,0) 22%,rgba(18,8,30,.10) 45%,rgba(18,8,30,.58) 78%,rgba(255,240,247,1) 100%)}
.pi-hero-in{position:relative;z-index:2;padding-bottom:110px;width:100%}
.pi-eyebrow{display:inline-block;background:var(--candy);color:var(--navy);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:8px}
.pi-hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(38px,6vw,64px);line-height:1.06;margin:16px 0 14px;max-width:15ch;text-shadow:0 2px 18px rgba(0,0,0,.3)}
.pi-hero h1 span{color:var(--candy)}
.pi-hero p{font-size:19px;max-width:48ch;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.pi-hero .pi-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

/* Proof pills */
.pi-proof{margin-top:-46px;position:relative;z-index:3}
.pi-proof ul{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;list-style:none;margin:0;padding:0}
.pi-proof li{background:var(--white);border:1px solid var(--lilac);color:var(--navy);font-weight:600;font-size:15px;padding:9px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(176,79,180,.10)}

/* Sections */
.pi-sec{padding:84px 0 0}
.pi-head{max-width:640px;margin:0 0 30px}
.pi-head h2{font-family:var(--serif);font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1.15;color:var(--navy);margin:12px 0 10px}
.pi-head p{color:var(--ink);margin:0}
.pi-center{text-align:center;margin-left:auto;margin-right:auto}

/* Why plan: text + scrapbook */
.pi-why{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.pi-why-list{display:grid;gap:14px;margin-top:22px}
.pi-why-card{background:var(--white);border:1px solid var(--lilac);border-radius:14px;padding:16px 20px}
.pi-why-card b{display:block;font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);margin-bottom:2px}
.pi-why-card span{color:var(--ink);font-size:16px}
.pi-scrap{position:relative;height:520px}
.pi-polaroid{position:absolute;background:#fff;padding:10px 10px 38px;border-radius:4px;box-shadow:0 14px 30px rgba(58,63,126,.18);transition:transform .3s ease}
.pi-polaroid img{width:100%;height:100%;object-fit:cover;border-radius:2px}
.pi-polaroid figcaption{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-family:var(--serif);font-weight:600;font-size:15px;color:var(--navy)}
.pi-polaroid:hover{transform:rotate(0deg) scale(1.03) !important;z-index:4}
.pi-p1{width:58%;height:330px;top:0;left:0;transform:rotate(-4deg)}
.pi-p2{width:50%;height:290px;top:40px;right:0;transform:rotate(5deg)}
.pi-p3{width:52%;height:250px;bottom:0;left:22%;transform:rotate(-1.5deg);z-index:2}
.pi-dot{position:absolute;width:118px;height:118px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 24px rgba(58,63,126,.2);bottom:28px;right:2%;z-index:3}
.pi-dot img{width:100%;height:100%;object-fit:cover}

/* Experiences grid */
.pi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pi-tile{position:relative;display:block;border-radius:16px;overflow:hidden;aspect-ratio:4/5;color:#fff;text-decoration:none;background:var(--candy)}
.pi-tile img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease, filter .4s ease}
.pi-tile::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(180deg,rgba(18,8,30,0) 40%,rgba(18,8,30,.72) 100%)}
.pi-tile:hover img{transform:scale(1.05)}
.pi-tile-txt{position:absolute;left:14px;right:14px;bottom:14px;z-index:2}
.pi-tile-txt b{display:block;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2}
.pi-tile-txt span{display:block;font-size:14.5px;line-height:1.35;opacity:.92;margin-top:4px}

/* Itineraries */
.pi-its{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pi-it{background:var(--white);border:1px solid var(--lilac);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pi-it-img{position:relative;aspect-ratio:16/10}
.pi-it-img img{width:100%;height:100%;object-fit:cover}
.pi-price{position:absolute;right:12px;top:12px;z-index:2;background:rgba(255,255,255,.92);border:1px solid var(--lilac);color:var(--navy);font-weight:700;font-size:14.5px;padding:4px 12px;border-radius:999px}
.pi-it-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.pi-it-body h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:0;color:var(--ink)}
.pi-it-body p{font-size:15.5px;color:var(--ink);flex:1}
.pi-more{margin-top:22px;text-align:center}

/* Full-bleed band */
.pi-band{position:relative;margin-top:96px;min-height:380px;display:flex;align-items:center}
.pi-band &gt; img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.pi-band::before{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(90deg,rgba(255,240,247,.94) 0%,rgba(255,240,247,.80) 42%,rgba(255,240,247,0) 72%)}
.pi-band-in{position:relative;z-index:2;width:100%}
.pi-band h2{font-family:var(--serif);font-weight:700;font-size:clamp(28px,3.6vw,42px);line-height:1.15;color:var(--navy);max-width:16ch;margin:0 0 12px}
.pi-band h2 span{color:var(--hot)}
.pi-band p{max-width:42ch}
.pi-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;max-width:640px}
.pi-step{background:rgba(255,255,255,.86);border:1px solid var(--lilac);border-radius:12px;padding:12px}
.pi-step b{display:block;font-family:var(--serif);color:var(--hot);font-size:20px;line-height:1}
.pi-step span{display:block;font-size:14.5px;font-weight:600;color:var(--navy);margin-top:6px;line-height:1.3}

/* Mood strip */
.pi-mood{margin-top:22px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.pi-mood-track{display:flex;gap:14px;width:max-content;animation:pi-drift 70s linear infinite}
.pi-mood:hover .pi-mood-track{animation-play-state:paused}
.pi-mood-item{margin:0;width:230px;height:300px;border-radius:14px;flex:0 0 auto}
.pi-mood-item:nth-child(even){height:260px;margin-top:40px}
.pi-mood-item img{width:100%;height:100%;object-fit:cover}
@keyframes pi-drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Reviews */
.pi-revs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pi-rev{background:linear-gradient(135deg,var(--pink-a) 0%,var(--lilac-a) 100%);border:1px solid var(--lilac);border-radius:16px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px}
.pi-stars{color:var(--hot);letter-spacing:2px;font-size:15px}
.pi-rev p{margin:0;font-size:16.5px;flex:1}
.pi-rev b{color:var(--navy)}
.pi-rev small{display:block;color:var(--grey);font-size:14px}

/* Quote */
.pi-quote{margin-top:96px;padding:72px 0 80px;background:var(--white);border-top:1px solid #f3d9ea}
.pi-q{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
.pi-q-side .pi-dot2{width:100%;aspect-ratio:4/5;border-radius:18px;margin-top:22px}
.pi-q-side .pi-dot2 img{width:100%;height:100%;object-fit:cover}
.pi-form{background:var(--blush);border:1px solid var(--lilac);border-radius:18px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pi-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.pi-field.pi-full{grid-column:1/-1}
.pi-field label{font-weight:700;color:var(--navy);font-size:15px}
.pi-field input,.pi-field select,.pi-field textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--lilac);border-radius:10px;padding:11px 12px;width:100%}
.pi-field input:focus,.pi-field select:focus,.pi-field textarea:focus{outline:2px solid var(--hot);outline-offset:1px;border-color:var(--hot)}
.pi-chips{display:flex;flex-wrap:wrap;gap:8px}
.pi-chip{position:relative}
.pi-chip input{position:absolute;opacity:0;width:1px;height:1px}
.pi-chip span{display:inline-block;background:#fff;border:1px solid var(--lilac);color:var(--navy);font-weight:600;font-size:14.5px;padding:7px 13px;border-radius:999px;cursor:pointer}
.pi-chip input:checked + span{background:var(--hot);border-color:var(--hot);color:#fff}
.pi-chip input:focus-visible + span{outline:2px solid var(--navy);outline-offset:2px}
.pi-form .pi-btn{grid-column:1/-1;justify-self:start;cursor:pointer;font-family:var(--sans)}
.pi-small{grid-column:1/-1;color:var(--grey);font-size:14px;margin:0}
.pi-thanks{grid-column:1/-1;background:var(--candy);border-radius:12px;padding:16px 18px;font-weight:600;color:var(--navy)}

/* Footer */
.pi-foot{background:#3a2240;color:#f6e6f0;padding:44px 0 34px}
.pi-foot .pi-wrap{display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center}
.pi-foot img.pi-flogo{width:140px}
.pi-foot img.pi-fqr{width:96px;border-radius:8px;background:#fff;padding:4px}
.pi-foot p{margin:0 0 4px;font-size:15.5px}
.pi-foot a{color:#fff;font-weight:600}
.pi-foot .pi-sisters{color:#e7c6dc;font-size:14.5px;margin-top:10px}

@media (max-width:960px){
  .pi-grid{grid-template-columns:repeat(3,1fr)}
  .pi-why{grid-template-columns:1fr;gap:36px}
  .pi-q{grid-template-columns:1fr}
  .pi-q-side .pi-dot2{display:none}
}
@media (max-width:720px){
  .pi-wrap{padding-left:18px;padding-right:18px}
  .pi-nav ul li:not(:last-child){display:none}
  .pi-nav img{width:112px}
  .pi-hero{min-height:560px}
  .pi-hero-in{padding-bottom:90px}
  .pi-hero p{font-size:17px}
  .pi-proof li{font-size:14px;padding:7px 12px}
  .pi-sec{padding-top:64px}
  .pi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .pi-tile-txt span{display:none}
  .pi-tile-txt b{font-size:16px}
  .pi-its,.pi-revs{grid-template-columns:1fr}
  .pi-scrap{height:400px}
  .pi-p1{height:250px} .pi-p2{height:220px} .pi-p3{height:190px}
  .pi-dot{width:88px;height:88px}
  .pi-band::before{background:linear-gradient(180deg,rgba(255,240,247,.92) 0%,rgba(255,240,247,.86) 70%,rgba(255,240,247,.55) 100%)}
  .pi-steps{grid-template-columns:1fr 1fr}
  .pi-form{grid-template-columns:1fr;padding:18px}
  .pi-mood-item{width:170px;height:220px}
  .pi-mood-item:nth-child(even){height:190px;margin-top:30px}
  .pi-foot .pi-wrap{grid-template-columns:1fr;text-align:center;justify-items:center}
}
@media (prefers-reduced-motion:reduce){
  .pi-mood-track{animation:none}
  .pi-mood{overflow-x:auto}
  .pi-site *{transition:none !important}
}

&lt;style&gt;
.pi-site{
  --blush:#fff0f7; --white:#ffffff; --candy:#fcd9ec; --candy-light:#f8e3ef;

  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.pi-site *{box-sizing:border-box}
.pi-site i,.pi-site em{font-style:normal !important}
.pi-site img{max-width:100%;display:block}
.pi-site p{margin:0 0 12px}
.pi-site h1,.pi-site h2,.pi-site h3{text-wrap:balance}
.pi-wrap{max-width:var(--wrap);margin:0 auto;padding-left:24px;padding-right:24px}

/* Unified tone: every mood photo gets the same soft pink grade so 33 different photos read as one set */
.pi-site .pi-tone{position:relative;overflow:hidden}
.pi-site .pi-tone img{transition:filter .4s ease}
.pi-site.pi-unified .pi-tone img{filter:saturate(.88) contrast(.95) brightness(1.03)}
.pi-site .pi-tone::after{content:&quot;&quot;;position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(160deg,rgba(234,76,156,.22),rgba(176,79,180,.10) 55%,rgba(255,214,170,.18));mix-blend-mode:soft-light;opacity:0;transition:opacity .4s ease}
.pi-site.pi-unified .pi-tone::after{opacity:1}

/* Nav */
.pi-nav{position:absolute;top:0;left:0;right:0;z-index:5}
.pi-nav .pi-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px}
.pi-nav img{width:132px}

/* Buttons */
.pi-btn{display:inline-block;background:var(--hot);color:#fff !important;font-weight:700;font-size:16px;padding:12px 22px;border-radius:999px;text-decoration:none;border:2px solid var(--hot);transition:transform .2s ease, background .2s ease}
.pi-btn:hover,.pi-btn:focus-visible{transform:translateY(-1px);background:#d93a8a;outline:none}
.pi-btn.pi-ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.85)}
.pi-btn.pi-ghost:hover{background:rgba(255,255,255,.28)}
.pi-link{color:var(--hot);font-weight:700;text-decoration:none;border-bottom:2px solid var(--candy)}
.pi-link:hover{border-color:var(--hot)}

/* Hero */
.pi-hero{position:relative;min-height:640px;display:flex;align-items:flex-end;color:#fff}

.pi-step span{display:block;font-size:14.5px;font-weight:600;color:var(--navy);margin-top:6px;line-height:1.3}

/* Mood strip */
.pi-mood{margin-top:22px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.pi-mood-track{display:flex;gap:14px;width:max-content;animation:pi-drift 70s linear infinite}
.pi-mood:hover .pi-mood-track{animation-play-state:paused}
.pi-mood-item{margin:0;width:230px;height:300px;border-radius:14px;flex:0 0 auto}
.pi-mood-item:nth-child(even){height:260px;margin-top:40px}
.pi-mood-item img{width:100%;height:100%;object-fit:cover}
@keyframes pi-drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Reviews */
.pi-revs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pi-rev{background:linear-gradient(135deg,var(--pink-a) 0%,var(--lilac-a) 100%);border:1px solid var(--lilac);border-radius:16px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px}
.pi-stars{color:var(--hot);letter-spacing:2px;font-size:15px}
.pi-rev p{margin:0;font-size:16.5px;flex:1}
.pi-rev b{color:var(--navy)}
.pi-rev small{display:block;color:var(--grey);font-size:14px}

/* Quote */
.pi-quote{margin-top:96px;padding:72px 0 80px;background:var(--white);border-top:1px solid #f3d9ea}
.pi-q{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
.pi-q-side .pi-dot2{width:100%;aspect-ratio:4/5;border-radius:18px;margin-top:22px}
.pi-q-side .pi-dot2 img{width:100%;height:100%;object-fit:cover}
.pi-form{background:var(--blush);border:1px solid var(--lilac);border-radius:18px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pi-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.pi-field.pi-full{grid-column:1/-1}
.pi-field label{font-weight:700;color:var(--navy);font-size:15px}
.pi-field input,.pi-field select,.pi-field textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--lilac);border-radius:10px;padding:11px 12px;width:100%}
.pi-field input:focus,.pi-field select:focus,.pi-field textarea:focus{outline:2px solid var(--hot);outline-offset:1px;border-color:var(--hot)}
.pi-chips{display:flex;flex-wrap:wrap;gap:8px}
.pi-chip{position:relative}
.pi-chip input{position:absolute;opacity:0;width:1px;height:1px}
.pi-chip span{display:inline-block;background:#fff;border:1px solid var(--lilac);color:var(--navy);font-weight:600;font-size:14.5px;padding:7px 13px;border-radius:999px;cursor:pointer}
.pi-chip input:checked + span{background:var(--hot);border-color:var(--hot);color:#fff}
.pi-chip input:focus-visible + span{outline:2px solid var(--navy);outline-offset:2px}
.pi-form .pi-btn{grid-column:1/-1;justify-self:start;cursor:pointer;font-family:var(--sans)}
.pi-small{grid-column:1/-1;color:var(--grey);font-size:14px;margin:0}
.pi-thanks{grid-column:1/-1;background:var(--candy);border-radius:12px;padding:16px 18px;font-weight:600;color:var(--navy)}

/* Footer */
.pi-foot{background:#3a2240;color:#f6e6f0;padding:44px 0 34px}
.pi-foot .pi-wrap{display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center}
.pi-foot img.pi-flogo{width:140px}
.pi-foot img.pi-fqr{width:96px;border-radius:8px;background:#fff;padding:4px}
.pi-foot p{margin:0 0 4px;font-size:15.5px}
.pi-foot a{color:#fff;font-weight:600}
.pi-foot .pi-sisters{color:#e7c6dc;font-size:14.5px;margin-top:10px}

@media (max-width:960px){
  .pi-grid{grid-template-columns:repeat(3,1fr)}
  .pi-why{grid-template-columns:1fr;gap:36px}
  .pi-q{grid-template-columns:1fr}
  .pi-q-side .pi-dot2{display:none}
}
@media (max-width:720px){
  .pi-wrap{padding-left:18px;padding-right:18px}
  .pi-nav ul li:not(:last-child){display:none}
  .pi-nav img{width:112px}
  .pi-hero{min-height:560px}
  .pi-hero-in{padding-bottom:90px}
  .pi-hero p{font-size:17px}
  .pi-proof li{font-size:14px;padding:7px 12px}
  .pi-sec{padding-top:64px}
  .pi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .pi-tile-txt span{display:none}
  .pi-tile-txt b{font-size:16px}
  .pi-its,.pi-revs{grid-template-columns:1fr}
  .pi-scrap{height:400px}
  .pi-p1{height:250px} .pi-p2{height:220px} .pi-p3{height:190px}
  .pi-dot{width:88px;height:88px}
  .pi-band::before{background:linear-gradient(180deg,rgba(255,240,247,.92) 0%,rgba(255,240,247,.86) 70%,rgba(255,240,247,.55) 100%)}
  .pi-steps{grid-template-columns:1fr 1fr}
  .pi-form{grid-template-columns:1fr;padding:18px}
  .pi-mood-item{width:170px;height:220px}
  .pi-mood-item:nth-child(even){height:190px;margin-top:30px}
  .pi-foot .pi-wrap{grid-template-columns:1fr;text-align:center;justify-items:center}
}
@media (prefers-reduced-motion:reduce){
  .pi-mood-track{animation:none}
  .pi-mood{overflow-x:auto}
  .pi-site *{transition:none !important}
}

<script>
(function(){
  var fr=document.getElementById('frame'),cd=document.getElementById('code');
  function press(a,b){a.setAttribute('aria-pressed','true');b.setAttribute('aria-pressed','false');}
  vPrev.onclick=function(){press(vPrev,vCode);fr.hidden=false;cd.hidden=true;};
  vCode.onclick=function(){press(vCode,vPrev);fr.hidden=true;cd.hidden=false;};
  sDesk.onclick=function(){press(sDesk,sPhone);fr.classList.remove('phone');};
  sPhone.onclick=function(){press(sPhone,sDesk);fr.classList.add('phone');};
  function tone(on){try{var s=fr.contentDocument.querySelector('.pi-site');s.classList.toggle('pi-unified',on);}catch(e){}}
  tOn.onclick=function(){press(tOn,tOff);tone(true);};
  tOff.onclick=function(){press(tOff,tOn);tone(false);};
  copy.onclick=function(){
    var t=cd.value;
    var done=function(){copy.textContent='Copied';setTimeout(function(){copy.textContent='Copy for GHL';},1600);};
    var fall=function(){vCode.onclick();cd.focus();cd.select();};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fall);}else{fall();}
  };
})();
</script>
